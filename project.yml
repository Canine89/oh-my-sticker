name: oh-my-sticker
options:
  bundleIdPrefix: com.goldenrabbit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 언어 모드: AppKit/콜백 코드 안정성 우선
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

targets:
  oh-my-sticker:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Sparkle
    info:
      path: Config/Info.plist
      properties:
        LSUIElement: true                              # 메뉴바 상주, Dock 아이콘 숨김
        CFBundleDisplayName: oh-my-sticker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "Copyright © 2026 Golden Rabbit"
        # Finder에서 "다음으로 열기 → oh-my-sticker" 로 곧장 화면에 띄우기
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
        # Sparkle 자동 업데이트
        SUFeedURL: https://raw.githubusercontent.com/Canine89/oh-my-sticker/main/appcast.xml
        SUPublicEDKey: iWBHueR8+zpSgvCBOBj1RUNqJbSGpQHkSyuCcMFeDoM=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400                # 하루 1회 백그라운드 확인
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenrabbit.ohmysticker
        PRODUCT_NAME: oh-my-sticker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES      # 공증 필수
        ENABLE_APP_SANDBOX: NO            # 사용자가 고른 보관 폴더를 계속 읽어야 한다
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M7NU9F8CZN      # 고정 신원 — ad-hoc 금지
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
